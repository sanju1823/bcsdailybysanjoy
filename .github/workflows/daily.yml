name: Daily BCS Update

on:
  schedule:
    - cron: '0 1 * * *'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Python setup
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Install package
        run: |
          pip install feedparser google-genai pytz
          
      - name: Run bot
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python daily_bot.py
          
      - name: Commit & Push
        run: |
          git config --global user.name "BCS Bot"
          git config --global user.email "bot@bcsdaily.com"
          git add data.json sitemap.xml
          git commit -m "Auto update: $(date +'%Y-%m-%d')" || echo "No changes"
          git push
