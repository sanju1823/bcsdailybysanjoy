name: Daily BCS Update

on:
  schedule:
    - cron: '0 1 * * *'  # BD sokal 7ta = UTC rat 1ta
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install feedparser google-generativeai pytz

      - name: Run Daily Bot
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python Daily-Bot.py

      - name: Commit and push if changed
        run: |
          git config --global user.name "BCS Daily Bot"
          git config --global user.email "bot@bcsdaily.com"
          git add data.json sitemap.xml
          git diff --staged --quiet || git commit -m "Auto update: $(date +'%Y-%m-%d')"
          git push
